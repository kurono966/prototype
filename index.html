<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>落ち物パズル - Mini Drop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>落ち物パズル - Mini Drop</h1>
        <p>矢印キーで移動、上矢印で回転、スペースで即落下。</p>
      </header>
      <section class="game">
        <canvas id="board" width="300" height="600" aria-label="ゲームボード"></canvas>
        <div class="panel">
          <div class="stats">
            <div>
              <span class="label">スコア</span>
              <span id="score">0</span>
            </div>
            <div>
              <span class="label">レベル</span>
              <span id="level">1</span>
            </div>
            <div>
              <span class="label">ライン</span>
              <span id="lines">0</span>
            </div>
          </div>
          <button id="start">スタート / リスタート</button>
          <div class="next">
            <span class="label">次のピース</span>
            <canvas id="next" width="120" height="120" aria-label="次のピース"></canvas>
          </div>
        </div>
      </section>
      <section class="tips">
        <p>ゲームオーバーになったらスタートボタンで再開できます。</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
